name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v1, v2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ${{ matrix.version }}/requirements.txt
      - working-directory: ${{ matrix.version }}
        run: python -m unittest discover -s tests -v
